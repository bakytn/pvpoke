<IfModule mod_ssl.c>
	<VirtualHost *:443>
		ServerName localhost
		DocumentRoot /var/www/html

		SSLEngine on
		SSLCertificateFile /etc/apache2/ssl/pvpoke-local.crt
		SSLCertificateKeyFile /etc/apache2/ssl/pvpoke-local.key

		<Directory /var/www/html>
			AllowOverride All
			Require all granted
		</Directory>
	</VirtualHost>
</IfModule>
