<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zygarden Tournament History</title><link rel="stylesheet" href="style.css?v=4"></head>
<body><main class="shell"><header><p class="eyebrow">Pokémon GO tournament archive</p><h1>Zygarden<br>history</h1><p class="lede">Find every completed tournament battle, roster, opponent, and score.</p><form id="search"><label for="trainer-name">Trainer name <small>exact match</small></label><div class="search-row"><input id="trainer-name" placeholder="Enter an exact trainer name" required maxlength="80"><button>Load history</button></div></form><p id="status" role="status">Ready to search Zygarden.</p></header><section id="app" hidden><div class="headline"><div><h2 id="title"></h2><p id="summary"></p></div><div class="actions"><button id="refresh" class="quiet">Refresh data</button><button id="download" class="quiet">Download JSON</button></div></div><div class="viewbar"><div class="switch"><button data-view="tournament" class="active">By tournament</button><button data-view="all">All battles</button><button data-view="silph">All battles – Silph Style</button></div><p id="favorite-note"></p></div><nav id="tournaments" aria-label="Tournaments"></nav><section id="content"></section></section></main><script src="app.js?v=4"></script></body></html>
